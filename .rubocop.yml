inherit_mode:
  merge:
    - Include

AllCops:
  # Review new cops before enabling them.
  NewCops: disable
  TargetRubyVersion: 3.2
  Exclude:
    - 'tmp/**/*'
    - 'vendor/**/*'
  Include:
    - '**/*.rbi'

# RBS inline comments intentionally begin without a space.
Layout/LeadingCommentSpace:
  Enabled: false

Layout/LineLength:
  Max: 140

Metrics/AbcSize:
  Max: 22
  Exclude:
    # A benchmark's operations are lambdas that close over its fixtures, so they are declared in the method that
    # builds those fixtures.
    - 'benchmark/**/*'

Metrics/ClassLength:
  Max: 170

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/MethodLength:
  Max: 24
  Exclude:
    # A benchmark's operations are lambdas that close over its fixtures, so they are declared in the method that
    # builds those fixtures.
    - 'benchmark/**/*'

Metrics/PerceivedComplexity:
  Max: 10
