inherit_mode:
  merge:
    - Include

AllCops:
  # Review new cops before enabling them.
  NewCops: disable
  TargetRubyVersion: 3.2
  Exclude:
    - 'tmp/**/*'
    - 'vendor/**/*'
  Include:
    - '**/*.rbi'

# RBS inline comments intentionally begin without a space.
Layout/LeadingCommentSpace:
  Enabled: false

Layout/LineLength:
  Max: 140

Metrics/AbcSize:
  Max: 22

Metrics/ClassLength:
  Max: 160

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/MethodLength:
  Max: 24

Metrics/PerceivedComplexity:
  Max: 10
