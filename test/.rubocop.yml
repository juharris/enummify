inherit_from: ../.rubocop.yml

Layout/LineLength:
  Max: 180

Metrics/AbcSize:
  Max: 45

Metrics/ClassLength:
  Max: 350

Metrics/MethodLength:
  Max: 40

Style/Documentation:
  Enabled: false

# Enum values methods return arrays, not hashes with an each_value method.
Style/HashEachMethods:
  Enabled: false
